[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfas-broiler-pbtk"
version = "0.1.0"
description = "PBTK model for the transfer of PFAS from feed into broiler chicken tissues"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Luca Przygoda" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Bayesian grid posterior (batched forward model)
bayes = ["jax>=0.4.30"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# T and P_il follow the notation of the manuscript
"src/pfas_broiler/model.py" = ["N803", "N806"]
